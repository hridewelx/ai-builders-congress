services:
  - type: web
    name: lotline-demo
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: LOTLINE_DEMO
        value: "1"
      # Free instances have no persistent disk. /tmp is writable and the demo
      # reseeds itself on every cold start, so a restart returns a clean demo.
      - key: LOTLINE_DATA
        value: /tmp/lotline
