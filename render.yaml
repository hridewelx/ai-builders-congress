services:
  - type: web
    name: lotline-demo
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: LOTLINE_DEMO
        value: "1"
      - key: LOTLINE_DATA
        value: /app/data
      - key: LOTLINE_SECURE_COOKIE
        value: "1"
      - key: LOTLINE_DETECTOR
        value: auto
