<div class="tabs">
  <a href="/lots/{{ lot.id }}" class="{{ 'on' if request.url.path == '/lots/' ~ lot.id }}">{{ tr('lot.overview') }}</a>
  {% if user.role != 'admin' %}
  <a href="/lots/{{ lot.id }}/plan" class="{{ 'on' if request.url.path.endswith('/plan') }}">{{ tr('lot.plan') }}</a>
  <a href="/lots/{{ lot.id }}/capture" class="{{ 'on' if request.url.path.endswith('/capture') }}">{{ tr('lot.capture') }}</a>
  <a href="/lots/{{ lot.id }}/review" class="{{ 'on' if request.url.path.endswith('/review') }}">{{ tr('lot.review') }}</a>
  {% endif %}
  <a href="/lots/{{ lot.id }}/decision" class="{{ 'on' if request.url.path.endswith('/decision') }}">{{ tr('lot.decision') }}</a>
  {% if user.role != 'admin' %}
  <a href="/lots/{{ lot.id }}/report" class="{{ 'on' if request.url.path.endswith('/report') }}">{{ tr('lot.report') }}</a>
  {% endif %}
</div>
